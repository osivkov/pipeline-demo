name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  bash-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tree (debug)
        run: |
          pwd
          ls -la
          find release-keeper -maxdepth 3 -type f -print

      - name: Bash syntax check (deploy.sh)
        run: |
          bash -n release-keeper/deploy/deploy.sh

      - name: Smoke deploy (success path)
        run: |
          set -e
          mkdir -p /tmp/src
          echo "OK VERSION" > /tmp/src/index.html

          mkdir -p /tmp/deploy_root
          release-keeper/deploy/deploy.sh release /tmp/src /tmp/deploy_root

          echo "Current points to:"
          readlink /tmp/deploy_root/current

          echo "Current content:"
          cat /tmp/deploy_root/current/index.html


      - name: Rollback command (manual) test
        run: |
            set -e

            # clean test area
            rm -rf /tmp/rollback_test
            mkdir -p /tmp/rollback_test/src
            mkdir -p /tmp/rollback_test/deploy_root

            # release 1: OK
            echo "OK VERSION" > /tmp/rollback_test/src/index.html
            release-keeper/deploy/deploy.sh release /tmp/rollback_test/src /tmp/rollback_test/deploy_root
            echo "After OK release:"
            cat /tmp/rollback_test/deploy_root/current/index.html

            # release 2: BROKEN (becomes current)
            echo "BROKEN VERSION" > /tmp/rollback_test/src/index.html
            release-keeper/deploy/deploy.sh release /tmp/rollback_test/src /tmp/rollback_test/deploy_root
            echo "After BROKEN release:"
            cat /tmp/rollback_test/deploy_root/current/index.html

            # manual rollback should restore OK
            release-keeper/deploy/deploy.sh rollback /tmp/rollback_test/deploy_root
            echo "After rollback:"
            cat /tmp/rollback_test/deploy_root/current/index.html

            if ! grep -q "OK VERSION" /tmp/rollback_test/deploy_root/current/index.html; then
              echo "Manual rollback did NOT restore OK VERSION"
              exit 1
            fi

      - name: Fail deploy + verify rollback (fail path)
        run: |
          set -e
          echo "BROKEN VERSION" > /tmp/src/index.html

          # EXPECT failure, but continue to verify rollback
          set +e
          echo "Before fail, current -> $(readlink /tmp/deploy_root/current)"
          FAIL_AFTER_SWITCH=1 release-keeper/deploy/deploy.sh release /tmp/src /tmp/deploy_root
          rc=$?
          echo "After fail, current -> $(readlink /tmp/deploy_root/current)"
          set -e

          echo "exit_code=$rc"
          if [[ $rc -eq 0 ]]; then
            echo "Expected failure but got success"
            exit 1
          fi

          echo "Current content after failed deploy (should be OK VERSION):"
          cat /tmp/deploy_root/current/index.html

          if ! grep -q "OK VERSION" /tmp/deploy_root/current/index.html; then
            echo "ROLLBACK did NOT work"
            exit 1
          fi